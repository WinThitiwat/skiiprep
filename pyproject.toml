[project]
name = "skiiprep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "pipelines/*", "services/*", "agents/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "spark: starts a Spark session (slow); skip with -m 'not spark'",
]
